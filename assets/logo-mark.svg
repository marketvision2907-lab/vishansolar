  <!-- Left wing: bright blue face + dark shadow face -->
  <polygon points="2,50 40,55 50,85 20,71" fill="#2484F0"/>
  <polygon points="20,71 40,55 50,85"       fill="#0D3EA8"/>

  <!-- Right wing: bright blue face + dark shadow face -->
  <polygon points="98,50 60,55 50,85 80,71" fill="#2484F0"/>
  <polygon points="80,71 60,55 50,85"        fill="#0D3EA8"/>
</svg>
