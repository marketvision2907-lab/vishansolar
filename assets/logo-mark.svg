<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 96" fill="none">
  <!-- 11 golden rays (thin pointed triangles) fanning 180° from top -->
  <polygon points="4,52 26.8,50.5 26.8,53.5"  fill="#F6A609"/>
  <polygon points="6.3,37.8 27.6,43.0 29.0,45.9" fill="#F6A609"/>
  <polygon points="12.8,25.0 30.0,36.9 32.2,39.0" fill="#F6A609"/>
  <polygon points="23.0,14.8 35.1,31.9 37.3,33.6" fill="#F6A609"/>
  <polygon points="35.8,8.3 41.5,29.2 43.7,30.2" fill="#F6A609"/>
  <polygon points="50,6   48.9,29.0 51.1,29.0"  fill="#F6A609"/>
  <polygon points="64.2,8.3 56.3,29.2 58.5,30.2" fill="#F6A609"/>
  <polygon points="77.0,14.8 62.7,31.9 64.9,33.6" fill="#F6A609"/>
  <polygon points="87.2,25.0 67.8,36.9 70.0,39.0" fill="#F6A609"/>
  <polygon points="93.7,37.8 71.0,43.0 72.4,45.9" fill="#F6A609"/>
